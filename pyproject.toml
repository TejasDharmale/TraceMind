[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemind-regression"
version = "0.1.2"
description = "Python SDK for tracking function execution and detecting behavioural regressions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "sdk"}

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.pytest.ini_options]
pythonpath = ["sdk"]
testpaths = ["tests"]
